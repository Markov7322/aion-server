#
# ----------------------------
# In game shop config's:
# ----------------------------
# Don't forget add on launcher -ingameshop

# Enable in game shop
# Default: false
gameserver.ingameshop.enable = false

# Enable gift system between factions
# Default: false
gameserver.ingameshop.gift = false

# allows gifts at all or no
gameserver.ingameshop.allow.gift = true

# Enable lightweight HTTP endpoint that allows external services (web shop, etc.)
# to request SystemMailService.sendMail(...). Default: false
gameserver.ingameshop.mailrpc.enable = false

# Interface the HTTP endpoint should bind to. Default: 127.0.0.1
gameserver.ingameshop.mailrpc.host = 127.0.0.1

# TCP port for the endpoint. Default: 9020
gameserver.ingameshop.mailrpc.port = 9020

# Shared secret that external callers must provide via the X-Auth-Token header.
# Leave empty to disable authentication (NOT recommended).
gameserver.ingameshop.mailrpc.secret =
